{%- assign tag = include.categories | first %}
{%- if tag == 'git' or tag == 'speaking' %}
  {%- assign tag_url = tag | prepend: '/' | append: '/' %}
{%- else %}
  {%- assign tag_url = tag | replace: '.', 'dot' | prepend: '/tag/' | append: '/' %}
{%- endif -%}
<a class="tag" href="{{ tag_url }}"><span class="nf" aria-hidden="true">&#xF02B;</span>{{ tag }}</a>
