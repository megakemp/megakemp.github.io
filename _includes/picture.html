{%- comment %}
  A 1x/2x JPEG + WebP set: {{ include.src }}-{1x,2x}.{jpg,webp}.
  Takes src, width, height, alt, for images below the fold lazy=true, and
  position (an object-position, where CSS crops the image).
{% endcomment -%}
<picture>
  <source type="image/webp" srcset="{{ include.src }}-1x.webp 1x, {{ include.src }}-2x.webp 2x">
  <img src="{{ include.src }}-1x.jpg" srcset="{{ include.src }}-1x.jpg 1x, {{ include.src }}-2x.jpg 2x" width="{{ include.width }}" height="{{ include.height }}" alt="{{ include.alt }}"{% if include.position %} style="object-position: {{ include.position }}"{% endif %}{% if include.lazy %} loading="lazy"{% endif %}>
</picture>
