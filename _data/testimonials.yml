# Testimonials, copied verbatim from design/pages/.
# clients: Services page. `pull` is the line quoted on the home page.
# attendees: Speaking page. students: Training page.

clients:
  skanska-byggvaror:
    quote: Enrico took on the responsibility for our web backend after a short handover. He has been able to resolve all issues and new requirements that we have thrown at him. He has with passion, knowledge and great enthusiasm supported our business and customers in an excellent way. Enrico's passion for teaching and mentoring has given us a lot more than just his work done.
    name: Jonas Rylander
    title: CTO, Skånska Byggvaror
    logo: { src: /assets/services/logo-skanska-byggvaror.png, alt: Skånska Byggvaror logo, width: 97, height: 32 }

  alfa-laval:
    quote: Enrico and I worked together during two intensive days to find the perfect solution. He found how to migrate from Bazaar to Git while keeping the history and the version flags, helped me structure the new repositories to fit our needs, and set up Git submodules to share parts of the code between projects. Enrico knows Git so well; when I have an idea, he helps me realise it in an effective manner.
    pull: Enrico knows Git so well; when I have an idea, he helps me realise it in an effective manner.
    name: Edith Lesage
    title: Automation Platform Expert, Alfa Laval
    logo: { src: /assets/services/logo-alfa-laval.png, alt: Alfa Laval logo, width: 105, height: 32 }

  spectrum:
    quote: We had the pleasure of inviting Enrico to a conference. Enrico delivered a very professional presentation with passion and knowledge. No question went unanswered and all our developers, from the seasoned Git veteran to the beginner, were happy.
    name: Ola Randerz
    title: Business Area Manager, Spectrum Digital Solutions
    logo: { src: /assets/services/logo-spectrum.png, alt: Spectrum Digital Solutions logo, width: 119, height: 40 }

  jyske-bank:
    quote: Enrico's presentation was very clear. He took a "simple" but complex tool like Git and broke it down into smaller parts that made it easier to understand. Enrico has a deep knowledge of Git and in general about source control, and is very accurate and thorough in his explanations — something that is very important when your audience is experienced software developers.
    name: Philip Juhl
    title: Product Owner, DevOps Service Team, Jyske Bank
    logo: { src: /assets/services/logo-jyske-bank.png, alt: Jyske Bank logo, width: 141, height: 40 }

