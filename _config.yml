name: Enrico Campidoglio
description: Freelance programmer, speaker and trainer. Pluralsight author. Open source maintainer.
timezone: Europe/Stockholm
markdown: kramdown
highlighter: rouge
url: https://megakemp.com
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: writing/page:num

plugins:
  - jekyll-redirect-from
  - jekyll-paginate
  - jekyll-sitemap

include:
  - .well-known

exclude:
  - design/
  - script/
  - _screenshots/
  - _verify/
  - docker-compose.yml

style:
  # Profile links in the footer
  social:
    github: ecampidoglio
    stackoverflow: 26396
    linkedin: ecampidoglio
    keybase: ecampidoglio

  # The copyright holder in the footer, and the contact address
  name: Enrico Campidoglio AB
  email: enrico@megakemp.com
